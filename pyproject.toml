[project]
name = "kubevirtcenter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Somers, Jonathan", email = "jonathan.somers@sscinc.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "kubernetes>=35.0.0",
    "pydantic-settings>=2.12.0",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.35.0",
]

[project.scripts]
kubevirtcenter = "kubevirtcenter:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
